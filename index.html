
<!DOCTYPE html>
<html>
<head>
    <title>DOM Manipulation</title>

    <!-- Linking CSS file -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Interactive Applications</h1>

    <!-- TO DO LIST -->
    <div class="container">

        <h2>My To-Do List</h2>

        <input type="text" id="taskInput"
               placeholder="Enter your task">

        <button id="addBtn">Add Task</button>

        <ul id="taskList"></ul>

    </div>


    <!-- IMAGE GALLERY -->
    <div class="container">

        <h2>Image Gallery</h2>

        <!-- Main Image -->
        <img id="mainImage"
             src="https://picsum.photos/id/1015/600/350"
             alt="Main Gallery Image">

        <!-- Thumbnails -->
        <div class="thumbnails">

            <img class="thumbnail"
                 src="https://picsum.photos/id/1015/150/100"
                 data-image="https://picsum.photos/id/1015/600/350"
                 alt="Mountain">

            <img class="thumbnail"
                 src="https://picsum.photos/id/1018/150/100"
                 data-image="https://picsum.photos/id/1018/600/350"
                 alt="Nature">

            <img class="thumbnail"
                 src="https://picsum.photos/id/1020/150/100"
                 data-image="https://picsum.photos/id/1020/600/350"
                 alt="Forest">

            <img class="thumbnail"
                 src="https://picsum.photos/id/1024/150/100"
                 data-image="https://picsum.photos/id/1024/600/350"
                 alt="Animal">

        </div>

    </div>


    <!-- JAVASCRIPT CODE -->
    <script>

        // TO DO LIST FUNCTIONALITY

        let addBtn = document.getElementById("addBtn");

        let taskInput = document.getElementById("taskInput");

        let taskList = document.getElementById("taskList");


        // Add task when button is clicked
        addBtn.addEventListener("click", function() {

            let task = taskInput.value.trim();

            if (task === "") {
                alert("Please enter a task!");
                return;
            }

            // Create new list item
            let li = document.createElement("li");

            li.textContent = task;

            // Create delete button
            let deleteBtn = document.createElement("button");

            deleteBtn.textContent = "Remove";

            deleteBtn.className = "deleteBtn";

            // Remove task when clicked
            deleteBtn.addEventListener("click", function() {
                li.remove();
            });

            // Add delete button inside list item
            li.appendChild(deleteBtn);

            // Add list item to task list
            taskList.appendChild(li);

            // Clear input box
            taskInput.value = "";

        });


        // IMAGE GALLERY FUNCTIONALITY

        let mainImage = document.getElementById("mainImage");

        let thumbnails = document.querySelectorAll(".thumbnail");


        // Add click event to every thumbnail
        thumbnails.forEach(function(image) {

            image.addEventListener("click", function() {

                // Change main image
                mainImage.src = image.dataset.image;

            });

        });

    </script>

</body>
</html>
