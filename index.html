
<!DOCTYPE html>
<html>
<head>
    <title>Async Programming</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            margin-top: 100px;
            background-color: #f2f2f2;
        }

        button {
            padding: 12px 20px;
            background-color: blue;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 5px;
        }

        #result {
            margin-top: 20px;
            font-size: 20px;
            color: green;
        }
    </style>
</head>

<body>

    <h1>Server Data Fetching</h1>

    <p>Click the button to fetch data from server.</p>

    <button onclick="fetchData()">Fetch Data</button>

    <div id="result"></div>

    <script>
        function fetchData() {

            document.getElementById("result").innerHTML =
                "Fetching data... Please wait!";

            // Creating a Promise
            let promise = new Promise((resolve, reject) => {

                // Simulating server delay
                setTimeout(() => {

                    let data = "Data received successfully from server!";

                    resolve(data);

                }, 3000);

            });

            // Handling resolved data
            promise.then((data) => {

                document.getElementById("result").innerHTML = data;

            }).catch((error) => {

                document.getElementById("result").innerHTML = error;

            });
        }
    </script>

</body>
</html>
